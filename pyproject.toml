[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-topology-generator"
version = "0.1.0"
description = "Topology-driven WireGuard config generator for Ansible, netplan, and wg-quick."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Mathieu Thibaut" }
]
keywords = ["wireguard", "ansible", "netplan", "vpn", "configuration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
gen-wireguard = "gen_wireguard:main"

[project.urls]
Homepage = "https://github.com/mthibaut/wireguard-topology-generator"
Issues = "https://github.com/mthibaut/wireguard-topology-generator/issues"

[tool.setuptools]
py-modules = ["gen_wireguard"]
